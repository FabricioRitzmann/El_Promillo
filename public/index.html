<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>El Promillo</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="auth-layout">
      <section class="auth-panel">
        <div class="brand-block">
          <div class="auth-brand-mark" aria-label="El Promillo">
            <span class="auth-brand-emblem" aria-hidden="true"></span>
            <img class="auth-brand-lockup" src="assets/el-promillo-title-lockup-new-cutout.png" alt="" aria-hidden="true">
          </div>
          <h1>Betreiberzugang</h1>
        </div>

        <div id="authMessage" class="message" role="status" aria-live="polite" hidden></div>

        <div class="auth-grid">
          <form id="loginForm" class="panel">
            <h2>Login</h2>
            <label>E-Mail
              <input name="email" type="email" autocomplete="email" required>
            </label>
            <label>Passwort
              <input name="password" type="password" autocomplete="current-password" required>
            </label>
            <div class="button-row wrap">
              <button class="primary" type="submit">Einloggen</button>
              <button id="showOneTimeLoginButton" class="secondary" type="button">Ohne Passwort einloggen</button>
            </div>
          </form>

          <form id="oneTimeLoginForm" class="panel" hidden>
            <h2>Einmalig einloggen</h2>
            <p class="muted">Wir senden dir einen einmal verwendbaren Login-Link. Danach kannst du im Kundenprofil ein neues Passwort festlegen.</p>
            <label>E-Mail
              <input name="email" type="email" autocomplete="email" required>
            </label>
            <div class="button-row wrap">
              <button class="primary" type="submit">Login-Link senden</button>
              <button id="cancelOneTimeLoginButton" class="secondary" type="button">Abbrechen</button>
            </div>
          </form>

          <form id="registerForm" class="panel">
            <h2>Registrieren</h2>
            <label>Name
              <input name="display_name" autocomplete="name">
            </label>
            <label>E-Mail
              <input name="email" type="email" autocomplete="email" required>
            </label>
            <label>Passwort
              <input name="password" type="password" autocomplete="new-password" minlength="6" required>
            </label>
            <button class="secondary" type="submit">Account erstellen</button>
          </form>
        </div>
      </section>
    </main>

    <script>
      if (window.location.protocol === 'file:') {
        const message = document.getElementById('authMessage');
        if (message) {
          message.hidden = false;
          message.className = 'message error';
          message.textContent = 'Bitte diese Datei nicht direkt öffnen. Starte den lokalen Server und öffne http://localhost:3000.';
        }
      }
    </script>
    <script type="module" src="js/auth.js"></script>
  </body>
</html>
